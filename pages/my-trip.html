<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071522"><title>My Trip | India Road Planner Premium</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../css/styles.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="container"><div class="breadcrumb"><a href="../index.html">Home</a> / My Trip</div><span class="eyebrow">KEEP YOUR JOURNEY TOGETHER</span><h1>Your plans, all<br>in one place.</h1><p>Save a lightweight trip note and local reminder on this browser. This starter does not sync between devices or send SMS.</p></div></section><section class="content-section container"><div class="two-col"><section class="panel"><h2>Save a trip note</h2><form id="trip-form" class="form-grid"><div class="field full"><label>Trip name</label><input name="name" placeholder="My Himalayan adventure" required></div><div class="field"><label>Start date</label><input type="date" name="date"></div><div class="field"><label>Transport</label><select name="mode"><option>Motorcycle</option><option>Car</option><option>Train</option><option>Flight</option><option>Mixed</option></select></div><div class="field full"><label>Notes / route</label><textarea name="notes" rows="4" placeholder="Stops, booking references (avoid sensitive details), packing reminders…"></textarea></div><div class="field full"><button class="btn primary" type="submit">Save on this device</button></div></form><div id="trip-status" class="status"></div></section><section class="panel"><h2>Saved trip</h2><div id="trip-saved" class="muted">No trip saved in this browser yet.</div><div class="form-actions"><button class="small-btn" id="clear-trip" type="button">Clear saved trip</button></div><hr style="border-color:var(--line);margin:25px 0"><h3>Destination reminder</h3><form id="alert-form" class="form-grid"><div class="field full"><label>Destination</label><input name="destination" placeholder="Destination name" required></div><div class="field full"><label>Target date</label><input name="date" type="date" required></div><div class="field full"><button class="btn glass" type="submit">Save reminder</button></div></form><div id="alert-result" class="result hidden" aria-live="polite"></div></section></div><script type="module">const form=document.querySelector("#trip-form"),view=document.querySelector("#trip-saved"),status=document.querySelector("#trip-status");function load(){try{const t=JSON.parse(localStorage.getItem("irp-trip")||"null");view.textContent=t?`${t.name} · ${t.date||"Date not set"} · ${t.mode}\n${t.notes||"No notes added."}`:"No trip saved in this browser yet."}catch{view.textContent="Browser storage unavailable."}}form.addEventListener("submit",e=>{e.preventDefault();const d=new FormData(form),t={name:d.get("name"),date:d.get("date"),mode:d.get("mode"),notes:d.get("notes")};try{localStorage.setItem("irp-trip",JSON.stringify(t));status.textContent="Trip saved locally.";load()}catch{status.textContent="Could not save in browser storage."}});document.querySelector("#clear-trip").addEventListener("click",()=>{localStorage.removeItem("irp-trip");load();status.textContent="Saved trip cleared."});load();</script></section></main><div id="site-footer"></div><script type="module" src="../js/main.js"></script></body></html>
